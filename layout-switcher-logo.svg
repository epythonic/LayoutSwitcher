<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Layout Switcher app icon</title>
  <desc id="desc">Rounded square app icon with two keyboard keys labeled A and Ф connected by circular swap arrows.</desc>

  <defs>
    <linearGradient id="bg" x1="170" y1="70" x2="850" y2="950" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2469F2"/>
      <stop offset="0.55" stop-color="#123FBE"/>
      <stop offset="1" stop-color="#08256F"/>
    </linearGradient>

    <linearGradient id="topArrow" x1="286" y1="221" x2="782" y2="374" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55E6FF"/>
      <stop offset="1" stop-color="#35B8FF"/>
    </linearGradient>

    <linearGradient id="bottomArrow" x1="764" y1="817" x2="248" y2="642" gradientUnits="userSpaceOnUse">
      <stop stop-color="#32D8B8"/>
      <stop offset="1" stop-color="#59F0D2"/>
    </linearGradient>

    <linearGradient id="keyFace" x1="260" y1="342" x2="442" y2="635" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF4FF"/>
    </linearGradient>

    <linearGradient id="keySide" x1="260" y1="558" x2="452" y2="735" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DCE8FF"/>
      <stop offset="1" stop-color="#8EA9EB"/>
    </linearGradient>

    <linearGradient id="keySideRight" x1="627" y1="570" x2="824" y2="743" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DCE8FF"/>
      <stop offset="1" stop-color="#8EA9EB"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#001A66" flood-opacity="0.35"/>
    </filter>

    <filter id="arrowShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#001A66" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- App icon background -->
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bg)"/>

  <!-- Subtle center glow -->
  <circle cx="512" cy="512" r="330" fill="#4B8DFF" opacity="0.10"/>

  <!-- Swap arrows -->
  <g filter="url(#arrowShadow)">
    <path d="M312 404C352 278 470 194 609 205C694 212 769 254 822 318" stroke="url(#topArrow)" stroke-width="58" stroke-linecap="round"/>
    <path d="M840 295L872 420C876 436 861 449 846 443L730 395C713 388 711 365 727 357L814 312C824 307 834 287 840 295Z" fill="url(#topArrow)"/>

    <path d="M712 626C668 746 552 823 418 811C336 804 263 763 211 702" stroke="url(#bottomArrow)" stroke-width="58" stroke-linecap="round"/>
    <path d="M187 725L154 600C150 584 166 571 181 577L296 626C313 633 315 655 299 664L213 710C203 715 192 733 187 725Z" fill="url(#bottomArrow)"/>
  </g>

  <!-- Left key, base -->
  <g transform="rotate(-8 335 557)" filter="url(#softShadow)">
    <rect x="164" y="446" width="342" height="230" rx="48" fill="url(#keySide)"/>
    <rect x="138" y="392" width="342" height="230" rx="48" fill="url(#keyFace)"/>
    <rect x="162" y="416" width="294" height="182" rx="34" stroke="#FFFFFF" stroke-width="18" opacity="0.9"/>
    <text x="309" y="558" text-anchor="middle" dominant-baseline="middle"
          font-family="Inter, SF Pro Display, Arial, sans-serif" font-size="154" font-weight="800" fill="#102B53">A</text>
  </g>

  <!-- Right key, base -->
  <g transform="rotate(10 700 566)" filter="url(#softShadow)">
    <rect x="552" y="460" width="342" height="230" rx="48" fill="url(#keySideRight)"/>
    <rect x="526" y="406" width="342" height="230" rx="48" fill="url(#keyFace)"/>
    <rect x="550" y="430" width="294" height="182" rx="34" stroke="#FFFFFF" stroke-width="18" opacity="0.9"/>
    <text x="697" y="548" text-anchor="middle" dominant-baseline="middle"
          font-family="Inter, SF Pro Display, Arial, sans-serif" font-size="154" font-weight="800" fill="#102B53">Ф</text>
  </g>
</svg>
